<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
  <title>Әліппе — әріптер мен сөздер</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔤</text></svg>" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="top-bar">
    <h1>🔤 Әліппе</h1>
    <p class="subtitle">Әріптерді үйрен, сөздерді тыңда!</p>
  </header>

  <main id="app">
    <section id="letter-grid" class="letter-grid" aria-label="Әріптер тізімі"></section>
  </main>

  <div id="overlay" class="overlay" hidden>
    <div class="card-detail" id="card-detail" role="dialog" aria-modal="true">
      <button class="close-btn" id="close-btn" aria-label="Жабу">✕</button>
      <div class="detail-letter" id="detail-letter"></div>
      <button class="replay-btn" id="replay-btn" aria-label="Қайта тыңдау">
        🔊 <span>Қайта тыңда</span>
      </button>
      <h2 class="words-title">Сөздер</h2>
      <div class="words-grid" id="words-grid"></div>
    </div>
  </div>

  <script src="/js/app.js" type="module"></script>
</body>
</html>
