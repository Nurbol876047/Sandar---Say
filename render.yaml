services:
  # Single service: server/index.js runs the API and also serves the built
  # frontend (npm run build at the repo root produces dist/, which the Express
  # app serves as static files with an SPA fallback — see server/index.js).
  # One free Render Web Service, one URL, no CORS/VITE_API_URL to keep in sync.
  #
  # Demo/contest project, not a real clinic — registration lets anyone pick
  # either role (parent/therapist), no invite code or approval step.
  #
  # Free plan: no persistent disk, so data/db.json (server/db.js) resets on every
  # redeploy and the service sleeps after ~15 min idle (first request after that
  # takes 30-60s to wake up).
  - type: web
    name: sandar-say
    env: node
    plan: free
    buildCommand: npm install && npm run build && npm install --prefix server
    startCommand: npm start --prefix server
