services:
  - type: web
    name: sandar-soyleydi
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Points the built frontend at the API service below. Update if you rename
      # the API service (Render URLs are https://<service-name>.onrender.com).
      - key: VITE_API_URL
        value: https://sandar-soyleydi-api.onrender.com

  # Backend for the progress module (parent/therapist accounts, child progress).
  # Free plan: no persistent disk, so data/db.json (server/db.js) resets on every
  # redeploy and the service sleeps after ~15 min idle (first request after that
  # takes 30-60s to wake up). Fine for a low-traffic/low-budget deploy; switch
  # `plan` to "starter" and add a `disk:` block (see git history) if real
  # persistence is ever needed.
  - type: web
    name: sandar-soyleydi-api
    env: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      # Set these in the Render dashboard (don't commit real credentials) —
      # otherwise the therapist account seeds with the dev defaults from
      # server/index.js, which anyone could read in this repo.
      - key: THERAPIST_EMAIL
        sync: false
      - key: THERAPIST_PASSWORD
        sync: false
      - key: THERAPIST_NAME
        sync: false
