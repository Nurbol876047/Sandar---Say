services:
  - type: web
    name: sandar-soyleydi
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Points the built frontend at the API service below. Update if you rename
      # the API service (Render URLs are https://<service-name>.onrender.com).
      - key: VITE_API_URL
        value: https://sandar-soyleydi-api.onrender.com

  # Backend for the progress module (parent/therapist accounts, child progress).
  # Needs a paid plan ("starter" or higher) — Render disks aren't available on the
  # free instance type. Without the disk, data/db.json resets on every redeploy.
  - type: web
    name: sandar-soyleydi-api
    env: node
    plan: starter
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    disk:
      name: sandar-soyleydi-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /data
      # Set these in the Render dashboard (don't commit real credentials) —
      # otherwise the therapist account seeds with the dev defaults from
      # server/index.js, which anyone could read in this repo.
      - key: THERAPIST_EMAIL
        sync: false
      - key: THERAPIST_PASSWORD
        sync: false
      - key: THERAPIST_NAME
        sync: false
