services:
  # The actual deployed static site is named "sandar-say" on Render (created
  # manually, before this file existed) — rename the block below to match if you
  # ever apply this as a Blueprint instead of creating services by hand.
  - type: web
    name: sandar-say
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Points the built frontend at the API service below. Update if you rename
      # the API service (Render URLs are https://<service-name>.onrender.com).
      - key: VITE_API_URL
        value: https://sandar-say-api.onrender.com

  # Backend for the progress module (parent/therapist accounts, child progress).
  # Demo/contest project, not a real clinic — registration lets anyone pick
  # either role, no invite code or approval step.
  # Free plan: no persistent disk, so data/db.json (server/db.js) resets on every
  # redeploy and the service sleeps after ~15 min idle (first request after that
  # takes 30-60s to wake up). Fine for a low-traffic/low-budget deploy; switch
  # `plan` to "starter" and add a `disk:` block (see git history) if real
  # persistence is ever needed.
  - type: web
    name: sandar-say-api
    env: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
